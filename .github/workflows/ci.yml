name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests never launch Electron; skipping the ~100 MB binary download
      # makes the job much faster.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      # Proves the Windows EXE still builds on every push (no release)
      - name: Package check (Windows EXE)
        if: runner.os == 'Windows'
        run: npx electron-builder --win dir --x64 --publish never

  # Exactly what a user gets from GitHub "Code -> Download ZIP": the source
  # without node_modules. Double-clicking start-lennart-terminal.cmd must
  # download the finished EXE and start Lennart Terminal.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run start-lennart-terminal.cmd like a user
        shell: cmd
        run: start-lennart-terminal.cmd

      - name: Check that the EXE was downloaded and is running
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'LennartTerminal-portable.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not downloaded' }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Downloaded: $mb MB"
          $running = $false
          for ($i = 0; $i -lt 40 -and -not $running; $i++) {
            Start-Sleep -Seconds 3
            $p = Get-Process | Where-Object { $_.Name -match 'Lennart' }
            if ($p) { $running = $true; $p | Format-Table Name, Id -AutoSize | Out-String | Write-Host }
          }
          if (-not $running) { throw 'Lennart Terminal did not start' }
          # The app is portable: it creates its Data folder next to the EXE
          for ($i = 0; $i -lt 20 -and -not (Test-Path (Join-Path $PWD 'Data\settings.json')); $i++) { Start-Sleep -Seconds 3 }
          if (-not (Test-Path (Join-Path $PWD 'Data\settings.json'))) { throw 'Data\settings.json was not created' }
          Write-Host 'Lennart Terminal started and created Data\settings.json'
          Get-Process | Where-Object { $_.Name -match 'Lennart' } | Stop-Process -Force

