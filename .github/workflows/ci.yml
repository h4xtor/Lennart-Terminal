name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests never launch Electron; skipping the ~100 MB binary download
      # makes the job much faster.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      # Proves the Windows EXE still builds on every push (no release)
      - name: Package check (Windows EXE)
        if: runner.os == 'Windows'
        run: npx electron-builder --win dir --x64 --publish never
