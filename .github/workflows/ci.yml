name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests never launch Electron; skipping the ~100 MB binary download
      # makes the job much faster.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      # Proves the Windows EXE still builds on every push (no release)
      - name: Package check (Windows EXE)
        if: runner.os == 'Windows'
        run: npx electron-builder --win dir --x64 --publish never

  # Exactly what a user gets from GitHub "Code -> Download ZIP": the source
  # without node_modules. Double-clicking start-lennart-terminal.cmd must
  # download the finished EXE and start Lennart Terminal.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Start + checks in ONE step: the runner kills a step's child
      # processes when that step ends.
      - name: Double-click start-lennart-terminal.cmd and check the app
        shell: pwsh
        run: |
          cmd /c start-lennart-terminal.cmd
          if ($LASTEXITCODE -ne 0) { throw "launcher exited with $LASTEXITCODE" }
          $exe = Join-Path $PWD 'LennartTerminal-portable.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not downloaded' }
          Write-Host ("Downloaded: {0} MB" -f [math]::Round((Get-Item $exe).Length / 1MB, 1))
          $settings = Join-Path $PWD 'Data\settings.json'
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            $ok = (Test-Path $settings) -and (Get-Process | Where-Object { $_.Name -match 'Lennart' })
          }
          Get-Process | Where-Object { $_.Name -match 'Lennart' } | Format-Table Name, Id -AutoSize | Out-String | Write-Host
          $log = Join-Path $env:TEMP 'lennart-terminal-main.log'
          if (Test-Path $log) { Write-Host '--- app log ---'; Get-Content $log -Tail 30 }
          if (-not $ok) { throw 'Lennart Terminal did not start (no process or no Data\settings.json)' }
          Write-Host 'OK: Lennart Terminal is running and created Data\settings.json next to the EXE'
          Get-Process | Where-Object { $_.Name -match 'Lennart' } | Stop-Process -Force

  # Microsoft Store package (MSIX/APPX). Uses the real Partner Center identity
  # when the repo variables are set, placeholders otherwise.
  store-package:
    runs-on: windows-latest
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Store package
        run: npm run store
      - name: Check the package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist-store -Filter *.appx | Select-Object -First 1
          if (-not $pkg) { throw 'no .appx produced' }
          Write-Host ("Store package: {0} ({1} MB)" -f $pkg.Name, [math]::Round($pkg.Length / 1MB, 1))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $names = $zip.Entries.FullName
          $manifest = (New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())).ReadToEnd()
          $zip.Dispose()
          if (-not ($names -contains 'AppxManifest.xml')) { throw 'AppxManifest.xml missing' }
          foreach ($need in @('Lennart Terminal.exe', 'app.asar')) {
            if (-not ($names | Where-Object { $_ -like "*$need" })) { throw "missing in package: $need" }
          }
          Write-Host ($names | Where-Object { $_ -like '*.exe' -or $_ -like '*app.asar' } | Out-String)
          if ($manifest -notmatch 'runFullTrust') { throw 'manifest lacks runFullTrust' }
          Write-Host 'OK: package has the app, the manifest and full-trust capability'
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist-store/*.appx

