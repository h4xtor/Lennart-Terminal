name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check + tests
        run: |
          npm run check
          npm test

      - name: Build Windows EXE (portable .exe + zip)
        run: npx electron-builder --win --x64 --publish never

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|zip)$' } | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'electron-builder produced no .exe/.zip' }
          $notes = @"
          **Lennart Terminal $env:GITHUB_REF_NAME**

          **Download one of these (Windows 10/11, 64-bit — nothing to install):**
          - ``LennartTerminal-*-portable.exe`` — one single file. Double-click it. A ``Data`` folder (settings, history, offline AI) is created next to it, so it works from a USB stick.
          - ``LennartTerminal-*-win-x64.zip`` — unzip anywhere and double-click ``Lennart Terminal.exe`` (starts a bit faster than the single file).

          AI providers are configured in the app under Settings (Ctrl+,). See the [README](https://github.com/$env:GITHUB_REPOSITORY#readme).
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME @files --title "Lennart Terminal $env:GITHUB_REF_NAME" --notes-file release-notes.md
